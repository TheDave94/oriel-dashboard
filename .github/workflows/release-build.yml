name: Release Build

# Triggered when release-please publishes a new GitHub Release.
# Builds dist/ from source at the tagged commit, uploads every file
# in dist/ as an individual release asset, then replays a HACS plugin
# install against the published release to prove every runtime chunk
# actually landed.
#
# Why individual assets (not a zip). Two reasons, both read off
# hacs/integration source (custom_components/hacs @ adb7d83, 2026-09-05;
# see tools/hacs-install-sim.py for the line-by-line replay):
#
#   (a) hacs.json sets `content_in_root: false`. With a release asset
#       matching `filename`, plugin.py:112-124 sets content.path.remote
#       = "release", and base.py:645-649 only narrows the download queue
#       to `filename` when content_in_root is TRUE. So HACS downloads
#       EVERY release asset and writes them flat into
#       www/community/oriel-dashboard/ (base.py:1268-1269). That is what
#       makes the code-split chunks resolve under /hacsfiles/.
#
#   (b) HACS *does* extract `zip_release` for plugins (base.py:555-614),
#       but plugin.py:150-159 registers the Lovelace module resource URL
#       from `filename` verbatim. A `filename: oriel.zip` would register
#       /hacsfiles/oriel-dashboard/oriel.zip as the module — which does
#       not load. So zip_release is not an option for a plugin whose
#       entry point must be the registered resource.
#
# Any change to this reasoning gets re-verified against hacs/integration
# source first — see CONVENTIONS.md §1.
#
# Separates concerns from release-please: that workflow owns versioning
# + changelog + tagging; this one owns producing the artifacts users
# install and proving they install. Either can be retried independently.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g. v1.4.0). Defaults to the latest release.'
        required: false

permissions:
  contents: write

jobs:
  build:
    name: Build + attach dist assets
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.ref.outputs.ref }}
      dist_files: ${{ steps.manifest.outputs.dist_files }}
    steps:
      - name: Determine ref
        id: ref
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "ref=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ steps.ref.outputs.ref }}

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: List dist files
        run: ls -la dist/

      - name: Record dist manifest
        id: manifest
        # Space-separated, sorted. The verify-install job compares this
        # against the release's asset list to tell propagation lag apart
        # from a genuinely missing file.
        run: echo "dist_files=$(ls dist | sort | tr '\n' ' ' | sed 's/ $//')" >> "$GITHUB_OUTPUT"

      - name: Upload each dist file as an individual release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd dist
          # --clobber overwrites any existing same-named asset (idempotent rerun).
          gh release upload "${{ steps.ref.outputs.ref }}" * --clobber

  verify-install:
    name: Verify HACS install of published assets
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Check out the tag under test so the simulator version that shipped
      # with that release is the one that judges it. A workflow_dispatch
      # against a tag older than the simulator fails here with a clear
      # "No such file" — that is the intended answer, not a bug.
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ needs.build.outputs.ref }}

      - name: Replay HACS plugin install against the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.build.outputs.ref }}
          EXPECTED_ASSETS: ${{ needs.build.outputs.dist_files }}
        run: |
          set -uo pipefail
          # The simulator is a single hard verdict: exit 0 means every chunk
          # the entry bundle can request is on disk after a HACS install;
          # non-zero means a real user would 404.
          #
          # The only thing retried here is asset-propagation lag — the
          # window right after `gh release upload` where the release API
          # (or the download CDN) does not yet list everything the build
          # job just pushed. A failure while the asset list already matches
          # dist/ is a genuine missing chunk and fails immediately.
          for attempt in 1 2 3; do
            if python3 tools/hacs-install-sim.py --repo "$REPO" --tag "$TAG" | tee sim.log; then
              exit 0
            fi

            actual=$(gh release view "$TAG" --repo "$REPO" --json assets --jq '.assets[].name' | sort | tr '\n' ' ' | sed 's/ $//')
            if [ "$actual" = "$EXPECTED_ASSETS" ] && grep -q '^FAIL:' sim.log; then
              echo "::error::Release $TAG lists every dist/ file, yet the HACS install replay failed. This is a genuine missing chunk, not propagation lag — not retrying."
              exit 1
            fi

            if [ "$attempt" -lt 3 ]; then
              echo "Release asset list does not yet match dist/ (or the fetch was transient) — attempt $attempt/3, waiting 20s for propagation."
              sleep 20
            fi
          done

          echo "::error::HACS install replay still failing after 3 attempts (20s apart). Expected assets: $EXPECTED_ASSETS"
          exit 1
