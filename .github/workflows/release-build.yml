name: Release Build

# Triggered when release-please publishes a new GitHub Release.
# Builds dist/ from source at the tagged commit, uploads every file
# in dist/ as an individual release asset, then replays a HACS plugin
# install against the published release to prove every runtime chunk
# actually landed.
#
# Why individual assets (not a zip). Two reasons, both read off
# hacs/integration source (custom_components/hacs @ adb7d83, 2026-09-05;
# see tools/hacs-install-sim.py for the line-by-line replay):
#
#   (a) hacs.json sets `content_in_root: false`. With a release asset
#       matching `filename`, plugin.py:112-124 sets content.path.remote
#       = "release", and base.py:645-649 only narrows the download queue
#       to `filename` when content_in_root is TRUE. So HACS downloads
#       EVERY release asset and writes them flat into
#       www/community/oriel-dashboard/ (base.py:1268-1269). That is what
#       makes the code-split chunks resolve under /hacsfiles/.
#
#   (b) HACS *does* extract `zip_release` for plugins (base.py:555-614),
#       but plugin.py:150-159 registers the Lovelace module resource URL
#       from `filename` verbatim. A `filename: oriel.zip` would register
#       /hacsfiles/oriel-dashboard/oriel.zip as the module — which does
#       not load. So zip_release is not an option for a plugin whose
#       entry point must be the registered resource.
#
# Any change to this reasoning gets re-verified against hacs/integration
# source first — see CONVENTIONS.md §1.
#
# Separates concerns from release-please: that workflow owns versioning
# + changelog + tagging; this one owns producing the artifacts users
# install and proving they install. Either can be retried independently.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g. v1.4.0). Defaults to the latest release.'
        required: false

permissions:
  contents: write

jobs:
  build:
    name: Build + attach dist assets
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.ref.outputs.ref }}
      dist_files: ${{ steps.manifest.outputs.dist_files }}
    steps:
      - name: Determine ref
        id: ref
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "ref=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ steps.ref.outputs.ref }}

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: List dist files
        run: ls -la dist/

      - name: Record dist manifest
        id: manifest
        # Space-separated, sorted. The verify-install job compares this
        # against the release's asset list to tell propagation lag apart
        # from a genuinely missing file.
        run: echo "dist_files=$(ls dist | sort | tr '\n' ' ' | sed 's/ $//')" >> "$GITHUB_OUTPUT"

      - name: Upload each dist file as an individual release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd dist
          # --clobber overwrites any existing same-named asset (idempotent rerun).
          gh release upload "${{ steps.ref.outputs.ref }}" * --clobber

  verify-install:
    name: Verify HACS install of published assets
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Check out the workflow's own commit, not the tag under test. The
      # simulator is CI tooling: on a `release: published` event the two are
      # the same commit anyway, and on workflow_dispatch this is what lets
      # the gate run against a tag that predates tools/hacs-install-sim.py.
      # The build job still checks out the tag, so the assets are the tag's.
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Replay HACS plugin install against the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.build.outputs.ref }}
          EXPECTED_ASSETS: ${{ needs.build.outputs.dist_files }}
        run: |
          set -u
          # Exit-code contract of tools/hacs-install-sim.py (see its docstring):
          #   0  pass        every chunk the entry bundle can request is on disk
          #   1  missing     a runtime chunk is absent -> real installs 404
          #   2  structural  no asset matches hacs.json filename / entry never landed
          #   3  transport   HTTP/network fault talking to GitHub
          #
          # Branching:
          #   0 -> done.
          #   3 -> retry. The fault is between us and GitHub, not in the
          #        release; the asset list is not consulted.
          #   1 -> fail fast. The release lists what the bundle needs and it
          #        still is not there. Waiting would not change the answer.
          #   2 -> ambiguous: a genuinely non-compliant release looks the same
          #        as one whose assets have not propagated yet. Compare the
          #        release's asset list against the dist/ manifest the build
          #        job recorded: complete -> structural, fail fast;
          #        incomplete -> propagation lag, retry.
          # Retry budget: 3 attempts, 20 s apart. stderr is folded into the
          # log so the verdict line and its reason are both in sim.log.
          for attempt in 1 2 3; do
            python3 tools/hacs-install-sim.py --repo "$REPO" --tag "$TAG" 2>&1 | tee sim.log
            rc=${PIPESTATUS[0]}

            case "$rc" in
              0)
                exit 0
                ;;
              1)
                echo "::error::Simulator exit 1: a runtime chunk is missing from release $TAG. Genuine defect, not propagation lag — not retrying."
                exit 1
                ;;
              2)
                actual=$(gh release view "$TAG" --repo "$REPO" --json assets --jq '.assets[].name' | sort | tr '\n' ' ' | sed 's/ $//')
                if [ "$actual" = "$EXPECTED_ASSETS" ]; then
                  echo "::error::Simulator exit 2 and release $TAG already lists every dist/ file. Structural failure (hacs.json filename vs assets), not propagation lag — not retrying."
                  exit 1
                fi
                echo "Simulator exit 2 while the release asset list still lags dist/ — propagation lag, attempt $attempt/3."
                ;;
              3)
                echo "Simulator exit 3: transport fault talking to GitHub — attempt $attempt/3."
                ;;
              *)
                echo "::error::Simulator exited $rc, outside its documented 0-3 contract. Treating as a hard failure."
                exit 1
                ;;
            esac

            if [ "$attempt" -lt 3 ]; then
              sleep 20
            fi
          done

          echo "::error::HACS install replay still failing after 3 attempts (20 s apart). Expected assets: $EXPECTED_ASSETS"
          exit 1
